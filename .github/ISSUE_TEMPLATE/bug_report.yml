name: Bug report
description: Something does not work, or an image gives the wrong result
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please never paste an API key or token into an issue.
  - type: input
    id: version
    attributes:
      label: PromptHound version
      description: Shown at the bottom left of the app, and on the About page.
      placeholder: e.g. 1.0.17
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which download are you using?
      options:
        - Installer (PromptHound-Setup)
        - Portable
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image or link (for extraction problems)
      description: |
        Attach the original, unedited image file, or paste its link (for example the Civitai page).
        The file contains its own prompt, so only share images you are happy to make public.
        If you cannot share it, say which tool made it (A1111, Forge, ComfyUI, ...).
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
