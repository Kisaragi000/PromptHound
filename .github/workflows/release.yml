name: Build & Release Windows Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, must match package.json (e.g. 1.0.8)'
        required: true
      publish:
        description: 'Publish a GitHub release (off: build only, installer kept as a run artifact)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($requested -ne $pkg) { throw "Release version $requested does not match package.json version $pkg" }
          "version=$pkg" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          npm install --force

      - name: Build Web Renderer & Electron Main
        run: npm run build:electron

      - name: Ensure Build Resources
        shell: pwsh
        run: |
          if (!(Test-Path "build")) { New-Item -ItemType Directory -Path "build" }
          # Installer artwork is committed (build/*.bmp); scripts/generate-installer-assets.mjs
          # renders it on a dev machine
          if (!(Test-Path "build/icon.ico")) {
            if (Test-Path "public/favicon.ico") {
              Copy-Item "public/favicon.ico" "build/icon.ico"
            }
          }

      # Build only: the release is created in one place below. Letting electron-builder
      # publish as well produced a second, draft release for every version.
      - name: Package Windows .exe (Installer & Portable)
        run: npx electron-builder --win --publish never

      # Test builds: the installer is downloadable from the run page, nothing is released
      - name: Upload test build
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: PromptHound-${{ steps.version.outputs.version }}-test-${{ github.sha }}
          path: |
            release/*.exe
          retention-days: 14

      - name: Extract release notes from CHANGELOG.md
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = ""
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw
            $match = [regex]::Match($text, "(?ms)^## v$([regex]::Escape($version))\s*\r?\n(.*?)(?=^## v|\z)")
            if ($match.Success) { $notes = $match.Groups[1].Value.Trim() }
          }
          if (-not $notes) { $notes = "PromptHound v$version" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      # Tag pushes release that tag; manual runs create tag v<version> on the built commit
      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PromptHound v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
