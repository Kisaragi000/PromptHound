name: Build & Release Windows Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          npm install --force

      - name: Build Web Renderer & Electron Main
        run: npm run build:electron

      - name: Ensure Build Resources
        shell: pwsh
        run: |
          if (!(Test-Path "build")) { New-Item -ItemType Directory -Path "build" }
          if (!(Test-Path "build/icon.ico")) {
            if (Test-Path "public/favicon.ico") {
              Copy-Item "public/favicon.ico" "build/icon.ico"
            }
          }

      - name: Package Windows .exe (Installer & Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
