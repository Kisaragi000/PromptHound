name: Build & Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, must match package.json (e.g. 1.0.8)'
        required: true
      publish:
        description: 'Publish a GitHub release (off: build only, installers kept as run artifacts)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($requested -ne $pkg) { throw "Release version $requested does not match package.json version $pkg" }
          "version=$pkg" >> $env:GITHUB_OUTPUT

  build-windows:
    name: Build Windows Installer (.exe)
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          npm install --force

      - name: Build Web Renderer & Electron Main
        run: npm run build:electron

      - name: Ensure Build Resources
        shell: pwsh
        run: |
          if (!(Test-Path "build")) { New-Item -ItemType Directory -Path "build" }
          # Installer artwork is committed (build/*.bmp); scripts/generate-installer-assets.mjs
          # renders it on a dev machine
          if (!(Test-Path "build/icon.ico")) {
            if (Test-Path "public/favicon.ico") {
              Copy-Item "public/favicon.ico" "build/icon.ico"
            }
          }

      # Build only: the release is created once, in the release job below. Letting
      # electron-builder publish as well produced a second, draft release for every version.
      - name: Package Windows .exe (Installer & Portable)
        run: npx electron-builder --win --publish never

      - name: Keep the Windows files for the release
        uses: actions/upload-artifact@v4
        with:
          name: PromptHound-${{ needs.version.outputs.version }}-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 14

  build-linux:
    name: Build Linux AppImage & .deb
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web Renderer & Electron Main
        run: npm run build:electron

      - name: Package Linux AppImage & .deb
        run: npx electron-builder --linux --publish never

      - name: Keep the Linux files for the release
        uses: actions/upload-artifact@v4
        with:
          name: PromptHound-${{ needs.version.outputs.version }}-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux]
    # Test builds (publish off) stop here: the files stay downloadable from the run page
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the Windows and Linux files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $notes = ""
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw
            $match = [regex]::Match($text, "(?ms)^## v$([regex]::Escape($version))\s*\r?\n(.*?)(?=^## v|\z)")
            if ($match.Success) { $notes = $match.Groups[1].Value.Trim() }
          }
          if (-not $notes) { $notes = "PromptHound v$version" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      # Tag pushes release that tag; manual runs create tag v<version> on the built commit
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PromptHound v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
