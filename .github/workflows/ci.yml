name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips Electron's binary download; the checks below don't start the app
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck (renderer, core and Electron main)
        run: npm run lint

      - name: Extraction and library tests
        run: npm test

      - name: Build the renderer
        run: npm run build
